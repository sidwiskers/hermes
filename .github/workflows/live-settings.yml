name: Telegram live settings conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-live-settings
  cancel-in-progress: false

jobs:
  live-settings:
    name: Exercise Bot API 10.5 setMySettings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Require dedicated test bot token
        env:
          HERMES_TEST_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HERMES_TEST_BOT_TOKEN" ]]; then
            echo "::error::Add the dedicated Telegram bot token as the BOT_TOKEN repository Actions secret."
            exit 1
          fi

      - name: Test live setMySettings endpoint
        env:
          HERMES_TEST_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HERMES_TEST_PRODUCTION: "true"
        run: go test -tags=integration -run '^TestLiveSetMySettings$' -count=1 -v ./integration
