name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Run the complete release gate, including cross-platform builds'
        required: false
        type: boolean
        default: false
      refresh_schema:
        description: 'Refresh the checked-in official Bot API schema and generated types'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || (!inputs.release_gate && !inputs.refresh_schema)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Verify
        run: ./scripts/verify.sh

      - name: Verify Guardian isolation and read-only validation
        run: python3 scripts/guardian/main.py sandbox-smoke

      - name: Verify competitor adapters
        run: ./scripts/verify-competitors.sh

      - name: Vulnerability and dependency audit
        run: ./scripts/security-check.sh

      - name: Fuzz smoke tests
        shell: bash
        run: |
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzDecodeUpdate$' -fuzztime 2s ./types
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCommandParsing$' -fuzztime 2s ./framework
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCallbackPrefixIndex$' -fuzztime 2s ./framework
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzTelegramEnvelopeDecode$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzMethodValidation$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzMultipartHeaderValidation$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCleanTelegramFilePath$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzInt64CallbackRoundTrip$' -fuzztime 2s .

      - name: Benchmark smoke test
        run: go test -run '^$' -bench 'BenchmarkRouter(Exact1|CallbackPrefix1000)$' -benchtime 100ms ./benchmarks

      - name: Compile examples
        run: go test ./examples/...

      - name: Compile live conformance suite
        run: go test -tags=integration -run '^$' ./integration

  minimum-go:
    if: github.event_name != 'workflow_dispatch' || (!inputs.release_gate && !inputs.refresh_schema)
    name: Test (Go 1.25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up latest Go 1.25 patch
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Confirm minimum toolchain
        shell: bash
        run: |
          version="$(go env GOVERSION)"
          [[ "$version" == go1.25.* ]]

      - name: Verify generated sources
        run: ./scripts/check-generated.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Compile examples and live conformance suite
        run: |
          go test ./examples/...
          go test -tags=integration -run '^$' ./integration/...

  portable:
    if: github.event_name != 'workflow_dispatch' || (!inputs.release_gate && !inputs.refresh_schema)
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  refresh-schema:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_schema && !inputs.release_gate
    name: Refresh official Bot API schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Fetch official schema and regenerate declarations
        run: |
          ./scripts/update-bot-api-schema.sh
          go run ./internal/cmd/api-surface -output spec/api-surface.txt
          jq -e '.version == "10.5"' spec/bot-api.json
          git diff --check

      - name: Commit regenerated schema to selected ref
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'The checked-in schema is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/bot-api.json spec/api-surface.txt types/zz_botapi_generated.go api/zz_botapi_aliases_generated.go zz_botapi_aliases_generated.go
          git commit -m 'Update Telegram Bot API schema to 10.5'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Run complete release checks
        run: ./scripts/release-check.sh
