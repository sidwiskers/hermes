name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate_botapi:
        description: Regenerate Bot API declarations and public API manifest on this branch
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  regenerate-botapi:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_botapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Format and regenerate schema aliases
        run: |
          gofmt -w $(git ls-files '*.go')
          go run ./internal/cmd/botapi-models
          go run ./internal/cmd/api-surface -output spec/api-surface.txt

      - name: Commit generated declarations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types/zz_botapi_generated.go api/zz_botapi_aliases_generated.go zz_botapi_aliases_generated.go spec/api-surface.txt
          if git diff --cached --quiet; then
            echo "Generated declarations are already current."
            exit 0
          fi
          git commit -m "chore(bot-api): refresh generated aliases and public API surface"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.regenerate_botapi
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Verify
        run: ./scripts/verify.sh

      - name: Verify Guardian isolation and read-only validation
        run: python3 scripts/guardian/main.py sandbox-smoke

      - name: Verify competitor adapters
        run: ./scripts/verify-competitors.sh

      - name: Vulnerability and dependency audit
        run: ./scripts/security-check.sh

      - name: Fuzz smoke tests
        shell: bash
        run: |
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzDecodeUpdate$' -fuzztime 2s ./types
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCommandParsing$' -fuzztime 2s ./framework
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCallbackPrefixIndex$' -fuzztime 2s ./framework
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzTelegramEnvelopeDecode$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzMethodValidation$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzMultipartHeaderValidation$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzCleanTelegramFilePath$' -fuzztime 2s ./api
          GOMAXPROCS=2 go test -run '^$' -parallel=2 -fuzz '^FuzzInt64CallbackRoundTrip$' -fuzztime 2s .

      - name: Benchmark smoke test
        run: go test -run '^$' -bench 'BenchmarkRouter(Exact1|CallbackPrefix1000)$' -benchtime 100ms ./benchmarks

      - name: Compile examples
        run: go test ./examples/...

      - name: Compile live conformance suite
        run: go test -tags=integration -run '^$' ./integration

  minimum-go:
    if: github.event_name != 'workflow_dispatch' || !inputs.regenerate_botapi
    name: Test (Go 1.25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up latest Go 1.25 patch
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Confirm minimum toolchain
        shell: bash
        run: |
          version="$(go env GOVERSION)"
          [[ "$version" == go1.25.* ]]

      - name: Verify generated sources
        run: ./scripts/check-generated.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Compile examples and live conformance suite
        run: |
          go test ./examples/...
          go test -tags=integration -run '^$' ./integration/...

  portable:
    if: github.event_name != 'workflow_dispatch' || !inputs.regenerate_botapi
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...
