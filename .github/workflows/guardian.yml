name: Hermes Guardian

on:
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [hermes-maintenance]
  workflow_dispatch:
    inputs:
      action:
        description: 'Maintenance action'
        type: choice
        default: check
        options:
          - check
          - retry-repair
          - release-current

permissions:
  contents: read

concurrency:
  group: hermes-guardian
  cancel-in-progress: false

env:
  GUARDIAN_MODE: ${{ vars.GUARDIAN_MODE || 'pull-request' }}
  GUARDIAN_REPAIR: ${{ vars.GUARDIAN_REPAIR || 'false' }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Select matching validation image
        shell: bash
        run: |
          version="$(go env GOVERSION)"
          [[ "$version" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'GUARDIAN_IMAGE=hermes-guardian:%s\n' "${version#go}" >> "$GITHUB_ENV"
          docker build --build-arg "GO_VERSION=${version#go}" \
            --tag "hermes-guardian:${version#go}" scripts/guardian
      - name: Inspect and repair
        if: inputs.action != 'release-current'
        env:
          GUARDIAN_PROVIDERS: ${{ vars.GUARDIAN_PROVIDERS || '[]' }}
          GUARDIAN_KEY_1: ${{ secrets.GUARDIAN_KEY_1 }}
          GUARDIAN_KEY_2: ${{ secrets.GUARDIAN_KEY_2 }}
          GUARDIAN_KEY_3: ${{ secrets.GUARDIAN_KEY_3 }}
          REQUESTED_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          args=()
          if [[ "$REQUESTED_ACTION" == 'retry-repair' ]]; then args+=(--retry); fi
          python3 scripts/guardian/main.py prepare "${args[@]}"
      - name: Validate update without repair credentials
        if: inputs.action != 'release-current'
        run: python3 scripts/guardian/main.py validate
      - name: Validate current main for release
        if: inputs.action == 'release-current'
        run: python3 scripts/guardian/main.py release-check
      - name: Preserve reports and candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guardian-candidate
          path: |
            .guardian/report.json
            .guardian/bundle.json
            .guardian/release.json
            .guardian/summary.md
            .guardian/diff.json
            .guardian/diff.md
            .guardian/audit.json
            .guardian/audit.txt
            .guardian/release.log
            .guardian/minimum-go.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: guardian-candidate
          path: .guardian
      - name: Publish verified candidate or preserved draft
        env:
          GH_TOKEN: ${{ secrets.GUARDIAN_GITHUB_TOKEN || github.token }}
          GUARDIAN_RELEASE: ${{ vars.GUARDIAN_RELEASE || 'false' }}
        shell: bash
        run: |
          if [[ -f .guardian/bundle.json ]]; then
            python3 scripts/guardian/main.py publish
          elif [[ -f .guardian/release.json ]]; then
            python3 scripts/guardian/main.py release
          fi
      - name: Update owner status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/guardian/main.py status
